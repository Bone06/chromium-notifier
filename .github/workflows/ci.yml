name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Reject tracked private key material
        shell: bash
        run: |
          if git ls-files | grep -Eiq '(^|/)(\.secrets)(/|$)|(^|/).*private.*key|\.(pem|key|p12|pfx)$'; then
            echo 'Tracked private key material or a .secrets path was found.' >&2
            exit 1
          fi
